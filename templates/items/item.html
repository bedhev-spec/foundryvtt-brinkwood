<form class="{{cssClass}} loadout-item-sheet" autocomplete="off">
  <header class="loadout-item-sheet__header">
    <img src="{{img}}" title="{{name}}" alt="{{name}}"{{#if editable}} data-action="editImage" data-edit="img" role="button" tabindex="0" aria-label="{{localize 'BITD.Name'}}: {{name}}"{{/if}}/>
    <div class="loadout-item-sheet__identity">
      <span>{{localize "BITD.LoadoutItem"}}</span>
      <input name="name" type="text" value="{{name}}" placeholder="{{localize 'BITD.Name'}}"/>
      <p>{{localize "BITD.LoadoutItemHint"}}</p>
    </div>
  </header>

<section class="loadout-item-sheet__section" aria-labelledby="item-{{_id}}-description-heading">
  <h2 id="item-{{_id}}-description-heading">{{localize "BITD.Description"}}</h2>
  <textarea id="item-description" name="system.description" aria-labelledby="item-{{_id}}-description-heading">{{system.description}}</textarea>
</section>

  <section class="loadout-item-sheet__section">
    <h2>{{localize "BITD.ItemDetails"}}</h2>
    <div class="loadout-item-sheet__grid">
      <label>
        <span>{{localize "BITD.Load"}}</span>
        <input id="item-load" type="number" min="0" step="1" name="system.load" value="{{system.load}}"{{#unless canEditLoad}} disabled aria-disabled="true"{{/unless}}>
      </label>
      <label>
        <span>{{localize "BITD.Uses"}}</span>
        <input id="item-uses" type="number" min="0" step="1" name="system.uses" value="{{system.uses}}">
      </label>
      <label>
        <span>{{localize "BITD.NumberAvailable"}}</span>
        <input id="item-num_available" type="number" min="0" step="1" name="system.num_available" value="{{system.num_available}}">
      </label>
      <label>
        <span>{{localize "BITD.Class"}}</span>
        <input id="item-class" type="text" name="system.class" value="{{system.class}}">
      </label>
    </div>
  </section>

  <section class="loadout-item-sheet__section" aria-labelledby="item-{{_id}}-additional-heading">
    <h2 id="item-{{_id}}-additional-heading">{{localize "BITD.AdditionalInfo"}}</h2>
    <textarea id="item-additional_info" name="system.additional_info" aria-labelledby="item-{{_id}}-additional-heading">{{system.additional_info}}</textarea>
  </section>

<section class="loadout-item-sheet__section loadout-item-sheet__effects" aria-labelledby="item-{{_id}}-effects-heading">
<h2 id="item-{{_id}}-effects-heading">{{localize "BITD.Effects"}}</h2>
      <div id="effects">{{> "systems/brinkwood/templates/parts/active-effects.html"}}</div>
    </section>
</form>
