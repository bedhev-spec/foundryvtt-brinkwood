<form class="{{cssClass}} legacy-item-sheet" autocomplete="off">
  <header class="sheet-header">
    <img src="{{img}}" title="{{name}}" alt="{{name}}"{{#if editable}} data-action="editImage" data-edit="img" role="button" tabindex="0" aria-label="{{localize 'BITD.Name'}}: {{name}}"{{/if}}/>
      <div class="header-fields">
          <h1 class="charname"><input name="name" type="text" value="{{name}}" placeholder="{{localize 'BITD.Name'}}"/></h1>
      </div>
  </header>

  {{!-- Sheet Body --}}
  <section class="sheet-body legacy-item-sheet__body">
    <div class="legacy-item-sheet__primary">
    <label class="label-stripe">{{localize "BITD.Description"}}</label>
    {{#if editable}}
      <prose-mirror name="system.description" value="{{system.description}}" data-document-uuid="{{item.uuid}}" collaborate toggled>{{{enrichedDescription}}}</prose-mirror>
    {{else}}
    <div class="editor editor-content">{{{enrichedDescription}}}</div>
    {{/if}}
    </div>
    {{#if isGM}}
      <aside class="legacy-item-sheet__secondary">
      <div class="label-stripe">{{localize "BITD.Logic"}}</div>
      <textarea name="system.logic">{{{system.logic}}}</textarea>
      </aside>
      <section class="legacy-item-sheet__effects">
      <div class="label-stripe">{{localize "BITD.Effects"}}</div>
      <div id="effects">{{> "systems/brinkwood/templates/parts/active-effects.html"}}</div>
      </section>
    {{/if}}
  </section>
</form>
