<div id="{{trackerId}}" class="big-teeth {{trackerClass}} tooltip" data-tooltip="{{tooltip}}" data-tooltip-class="brinkwood-tooltip" data-tooltip-direction="RIGHT">
  {{#if rollLabel}}
  <span class="black-label"><button type="button" class="roll-die-attribute rollable-text" data-roll-attribute-label="{{rollLabel}}" data-roll-value="{{rollValue}}">{{localize rollLabel}}</button></span>
  {{else}}
  <span class="black-label">{{#if label}}{{localize label}}{{else}}{{localize tracker.name}}{{/if}}</span>
  {{/if}}
  <div class="legacy-tracker-segments" role="group" aria-label="{{localize tracker.name}}">
    {{#times_from_1 tracker.max}}
    <button type="button" class="dot-value" data-path="{{../trackerPath}}" data-max_value="{{../tracker.max}}" data-value="{{this}}" aria-label="{{localize ../tracker.name}} {{this}} of {{../tracker.max}}" aria-pressed="{{#if (lt ../tracker.value this)}}false{{else}}true{{/if}}"{{#unless ../editable}} disabled{{/unless}}>
      {{#if (lt ../tracker.value this)}}
      <img class="big-teeth" src="systems/brinkwood/styles/assets/teeth/stresstooth-halfgrey.png" alt="">
      {{else}}
      <img class="big-teeth" src="systems/brinkwood/styles/assets/teeth/stresstooth-{{../toothColor}}.png" alt="">
      {{/if}}
    </button>
    {{/times_from_1}}
  </div>
</div>
