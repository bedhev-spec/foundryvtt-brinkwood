<div id="character-{{_id}}-attributes" class="attributes">
  {{#each system.attributes as |attribute attribute_name|}}

  <div id="character-{{../_id}}-attributes-{{attribute_name}}" class="attribute">
    <div id="character-{{../_id}}-attributes-{{attribute_name}}-title" class="attributes-exp">
      <div class="stripe">
        <button type="button" class="attribute-label roll-die-attribute rollable-text" data-roll-attribute="{{attribute_name}}" data-roll-attribute-label="{{attribute.label}}" data-roll-value={{attribute.value}}>{{localize attribute_name}}</button>
      </div>
    </div>

    {{!-- Skills --}}

    {{#each attribute.skills as |skill skill_name|}}

    <div class="flex-horizontal">
      <div class="attributes-container">
	{{#times_from_1 4}}
	<button type="button" class="dot-value {{#if (lt skill.value this)}}dot-value--empty{{else}}dot-value--filled{{/if}}" data-max_value="4" data-value="{{this}}" data-path="system.attributes.{{attribute_name}}.skills.{{skill_name}}.value" aria-label="{{localize skill.label}} {{this}} of 4" aria-pressed="{{#if (lt skill.value this)}}false{{else}}true{{/if}}"{{#unless @root.editable}} disabled{{/unless}}>
          {{#if (lt skill.value this)}}
          &#9898;
	  {{else}}
	  &#9899;
	  {{/if}}
	</button>
	{{/times_from_1}}
            <button type="button" class="attribute-skill-label roll-die-attribute rollable-text tooltip" data-roll-attribute-label="{{skill.label}}" data-roll-attribute="{{skill_name}}" data-roll-value={{skill.value}} data-tooltip="{{skill.desc}}" data-tooltip-class="brinkwood-tooltip" data-tooltip-direction="RIGHT">{{localize skill.label}}</button>
      </div>
    </div>
    {{/each}}

  </div>
  {{/each}}
</div>
